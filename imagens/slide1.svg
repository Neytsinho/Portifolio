<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0d6efd" />
    </linearGradient>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="500" fill="url(#bg1)" />
  <rect width="1200" height="500" fill="url(#grid1)" />

  <!-- Elementos decorativos de fundo -->
  <circle cx="980" cy="120" r="140" fill="#0d6efd" fill-opacity="0.2" />
  <circle cx="220" cy="400" r="180" fill="#38bdf8" fill-opacity="0.1" />

  <!-- Janela de editor de código -->
  <rect x="720" y="90" width="380" height="250" rx="14" fill="#0b1120" stroke="#334155" stroke-width="2" />
  <circle cx="745" cy="112" r="6" fill="#ef4444" />
  <circle cx="765" cy="112" r="6" fill="#f59e0b" />
  <circle cx="785" cy="112" r="6" fill="#22c55e" />
  <line x1="720" y1="130" x2="1100" y2="130" stroke="#1e293b" stroke-width="2" />

  <text x="745" y="165" fill="#38bdf8" font-family="monospace" font-size="16">const dev = {</text>
  <text x="765" y="195" fill="#94a3b8" font-family="monospace" font-size="15">nome: "Natan Chaves",</text>
  <text x="765" y="220" fill="#94a3b8" font-family="monospace" font-size="15">stack: ["HTML5", "CSS3", "Python"],</text>
  <text x="765" y="250" fill="#4ade80" font-family="monospace" font-size="15">status: "Disponivel para projetos"</text>
  <text x="745" y="280" fill="#38bdf8" font-family="monospace" font-size="16">};</text>

  <!-- Ícone geométrico à esquerda -->
  <rect x="110" y="110" width="110" height="110" rx="22" fill="#0d6efd" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2" />
  <text x="165" y="178" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="40" font-weight="bold">{ }</text>
</svg>