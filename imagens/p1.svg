<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="gp1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#gp1)" />

  <!-- Dashboard card mockup -->
  <rect x="140" y="70" width="520" height="310" rx="18" fill="#0b1120" fill-opacity="0.88" stroke="#38bdf8" stroke-width="2" />
  <text x="175" y="115" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="22">Smart Home e Energia IoT</text>
  <text x="175" y="140" fill="#38bdf8" font-family="monospace" font-size="14">FastAPI + ESP32 Telemetry</text>

  <!-- Barras de consumo simuladas -->
  <rect x="175" y="260" width="45" height="80" rx="6" fill="#0ea5e9" />
  <rect x="240" y="220" width="45" height="120" rx="6" fill="#38bdf8" />
  <rect x="305" y="190" width="45" height="150" rx="6" fill="#22d3ee" />
  <rect x="370" y="235" width="45" height="105" rx="6" fill="#0ea5e9" />

  <!-- Indicador de status -->
  <rect x="455" y="185" width="170" height="155" rx="12" fill="#1e293b" />
  <text x="540" y="225" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Consumo Atual</text>
  <text x="540" y="268" text-anchor="middle" fill="#4ade80" font-family="monospace" font-weight="bold" font-size="30">1.42 kW</text>
  <text x="540" y="305" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13">● ESP32 Online</text>
</svg>