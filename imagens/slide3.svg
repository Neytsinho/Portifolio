      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg3)" />

  <!-- Trilhas de circuito / telemetria -->
