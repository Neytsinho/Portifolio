    <circle cx="520" cy="170" r="5" fill="#2dd4bf" />
    <circle cx="880" cy="140" r="5" fill="#2dd4bf" />
    <circle cx="850" cy="260" r="5" fill="#2dd4bf" />
  </g>

  <!-- Chip ESP32 / Microcontrolador ilustrativo -->
  <rect x="820" y="115" width="150" height="150" rx="18" fill="#0f172a" stroke="#2dd4bf" stroke-width="3" />
  <rect x="845" y="140" width="100" height="100" rx="8" fill="#134e4a" />
