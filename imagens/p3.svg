<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="gp3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#gp3)" />

  <!-- Terminal CLI -->
  <rect x="130" y="70" width="540" height="310" rx="16" fill="#090d16" stroke="#34d399" stroke-width="2" />
  <text x="165" y="115" fill="#fbbf24" font-family="monospace" font-weight="bold" font-size="18">$ python monitor_reservatorio.py</text>
  <line x1="165" y1="132" x2="635" y2="132" stroke="#1e293b" stroke-width="2" />

  <text x="165" y="170" fill="#e2e8f0" font-family="monospace" font-size="16">[INFO] Leitura do sensor: 82%</text>
