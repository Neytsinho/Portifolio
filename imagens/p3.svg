  <text x="165" y="240" fill="#38bdf8" font-family="monospace" font-size="16">[CALC] Consumo médio: 145 L/dia</text>
  <text x="165" y="275" fill="#facc15" font-family="monospace" font-size="16">[WARN] Faixa econômica ativa</text>

  <!-- Barra visual no terminal -->
  <rect x="165" y="305" width="470" height="24" rx="6" fill="#1e293b" />
  <rect x="165" y="305" width="385" height="24" rx="6" fill="#10b981" />
  <text x="400" y="322" text-anchor="middle" fill="#052e16" font-family="monospace" font-weight="bold" font-size="14">82% CAPACIDADE</text>
